:root {
  --bg: #FFF6EC;
  --surface: #FFFFFF;
  --surface-soft: #EAF6F4;
  --surface-peach: #FFF0E9;
  --ink: #16333A;
  --muted: #60757A;
  --line: #E7D9CB;
  --teal: #0E7C7B;
  --teal-dark: #075E5D;
  --blue: #2A6CB6;
  --coral: #FF6B5B;
  --coral-dark: #D9483A;
  --amber: #F5A623;
  --mint: #D9EEE9;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #122527;
    --surface: #1A3436;
    --surface-soft: #214544;
    --surface-peach: #3A2B2A;
    --ink: #F8F0E7;
    --muted: #B9C9C5;
    --line: #3B5453;
    --teal: #4CC3BC;
    --teal-dark: #8FE0D8;
    --blue: #7FB6EE;
    --coral: #FF8A7A;
    --coral-dark: #FFA89E;
    --amber: #FFC46B;
    --mint: #234845;
  }
}
* {
  box-sizing: border-box;
}
html {
  background: var(--bg);
}
body {
  margin: 0;
  font-family: "DM Sans", system-ui, sans-serif;
  background: var(--bg);
  color: var(--ink);
}
.font-display {
  font-family: "Fraunces", Georgia, serif;
}
::selection {
  background: #FFD9D1;
  color: #16333A;
}
