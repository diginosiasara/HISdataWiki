:root {
  --paper: #f4f8f7;
  --surface: #ffffff;
  --surface-2: #e8f3f1;
  --ink: #102a2b;
  --muted: #5f7472;
  --line: #d6e5e2;
  --teal: #0e7770;
  --teal-dark: #075e58;
  --blue: #175f8a;
  --blue-soft: #e2eef6;
  --coral: #ff6f61;
  --coral-soft: #ffe9e5;
  --amber: #f6b84d;
  --amber-soft: #fff3da;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #0d1b1c;
    --surface: #142827;
    --surface-2: #1c3735;
    --ink: #f2f7f5;
    --muted: #b7c8c6;
    --line: #2d4745;
    --teal: #4ac8bd;
    --teal-dark: #8fe1d8;
    --blue: #79b9dc;
    --blue-soft: #1e3644;
    --coral: #ff8a7d;
    --coral-soft: #472824;
    --amber: #f6c25f;
    --amber-soft: #3e3018;
  }
}
* {
  box-sizing: border-box;
}
html {
  scroll-behavior: smooth;
}
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: 'Manrope', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
.font-display {
  font-family: 'Fraunces', Georgia, serif;
}
::selection {
  background: var(--coral);
  color: white;
}
.no-scrollbar::-webkit-scrollbar {
  display: none;
}
.no-scrollbar {
  scrollbar-width: none;
}
.flow-line {
  background: linear-gradient(90deg, var(--teal), var(--blue), var(--coral));
}
