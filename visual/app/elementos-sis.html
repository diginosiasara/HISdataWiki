:root {
  --paper: #f4f8f7;
  --surface: #ffffff;
  --surface-2: #e8f3f1;
  --surface-3: #fff1ec;
  --ink: #132e2b;
  --muted: #5f716f;
  --line: #cfe2de;
  --teal: #0e7c72;
  --teal-deep: #07564f;
  --blue: #2568b8;
  --coral: #ff6f59;
  --coral-soft: #fff0ec;
  --amber: #f2a93b;
  --good: #d9f2e6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #0f1c1a;
    --surface: #172927;
    --surface-2: #1e3632;
    --surface-3: #3a2620;
    --ink: #f0f7f5;
    --muted: #b7c8c4;
    --line: #36514d;
    --teal: #43b8a9;
    --teal-deep: #76d2c4;
    --blue: #73a9ec;
    --coral: #ff8a72;
    --coral-soft: #3a2822;
    --amber: #f4c066;
    --good: #204838;
  }
}
* {
  box-sizing: border-box;
}
html {
  scroll-behavior: smooth;
}
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "Public Sans", system-ui, sans-serif;
}
.font-display {
  font-family: "Fraunces", Georgia, serif;
}
button {
  font: inherit;
}
a {
  color: inherit;
}
::selection {
  background: #ffd8cf;
  color: #132e2b;
}
.chain-scroll {
  scrollbar-width: thin;
}
