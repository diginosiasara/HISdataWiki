:root {
  --surface: #f3f8f7;
  --surface-2: #ffffff;
  --ink: #123337;
  --muted: #5b7172;
  --line: #d7e6e2;
  --teal: #0d7c78;
  --teal-dark: #095f5d;
  --teal-soft: #dff2ef;
  --blue: #2b7fb8;
  --blue-soft: #e3f0f8;
  --coral: #ff7d6b;
  --coral-soft: #ffe9e5;
  --amber: #f7b731;
  --amber-soft: #fff3d6;
  --shadow: 0 14px 34px rgba(18,51,55,.09);
}
@media (prefers-color-scheme: dark) {
  :root {
    --surface: #122324;
    --surface-2: #1a3334;
    --ink: #f2f8f7;
    --muted: #b8cccc;
    --line: #335656;
    --teal: #4ec9c2;
    --teal-dark: #8be7e0;
    --teal-soft: #224b49;
    --blue: #72b7e6;
    --blue-soft: #234a5e;
    --coral: #ff9a8b;
    --coral-soft: #50332f;
    --amber: #ffd66d;
    --amber-soft: #4a3f21;
    --shadow: 0 14px 34px rgba(0,0,0,.28);
  }
}
* {
  box-sizing: border-box;
}
html {
  scroll-behavior: smooth;
}
body {
  margin: 0;
  background: var(--surface);
  color: var(--ink);
  font-family: "Public Sans",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
.font-display {
  font-family: "Fraunces",Georgia,serif;
}
button,input {
  font: inherit;
}
button {
  cursor: pointer;
}
input {
  color: var(--ink);
}
.table-wrap {
  overflow-x: auto;
}
table {
  border-collapse: collapse;
}
::selection {
  background: var(--coral);
  color: white;
}
