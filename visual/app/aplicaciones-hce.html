:root {
  --bg: #eff6f4;
  --surface: #ffffff;
  --surface-2: #e3f0ee;
  --surface-3: #fff0ec;
  --ink: #122d2b;
  --muted: #56716d;
  --line: #cfe3df;
  --primary: #087f78;
  --primary-dark: #065f5c;
  --blue: #2563eb;
  --blue-soft: #e7eefc;
  --coral: #ff6f59;
  --coral-dark: #d94b35;
  --amber: #f59e0b;
  --amber-soft: #fff5dc;
  --good: #0d8a68;
  --good-soft: #e5f5ef;
  --danger-soft: #ffeee9;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1d1c;
    --surface: #142a28;
    --surface-2: #1c3734;

    --coral: #ff8b77;
    --coral-dark: #ff9c88;
    --amber: #ffbd47;
    --amber-soft: #3d3320;
    --good: #59d2a8;
    --good-soft: #183e33;
    --danger-soft: #442823;
  }
}
* {
  box-sizing: border-box;
}
html {
  scroll-behavior: smooth;
}
body {
  margin: 0;
  font-family: 'Public Sans', system-ui, sans-serif;
  color: var(--ink);
  background: var(--bg);
}
.font-display {
  font-family: 'Fraunces', Georgia, serif;
}
button {
  font: inherit;
}
button:focus-visible, a:focus-visible {
  outline: 3px solid var(--coral);
  outline-offset: 3px;
}
::-webkit-scrollbar {
  width: 10px;
}
::-webkit-scrollbar-thumb {
  background: #b8d3cf;
  border-radius: 20px;
}
